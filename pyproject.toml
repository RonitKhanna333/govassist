[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "govassist-corpus"
version = "0.1.0"
description = "Grounded corpus tooling for GovAssist: build scheme.md files whose every quote is provably verbatim from an official source document."
requires-python = ">=3.10"
dependencies = [
    "pdfminer.six>=20231228",
    "pypdf>=4.0.0",
    "requests>=2.31.0",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "fastapi>=0.110",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
serve = ["uvicorn>=0.29"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["data/scripts", "."]

[tool.setuptools.packages.find]
# data/scripts/ is deliberately flat, non-package CLI tooling (see its own
# docstrings) -- reached via pytest's pythonpath above, never pip-installed.
# Only api/ is a real installable package. Without this, setuptools' flat-
# layout auto-discovery finds "api" and "data" as two ambiguous top-level
# packages and refuses to guess, and `pip install -e` fails outright.
include = ["api*"]

[tool.setuptools.package-data]
# .txt prompt files aren't Python source, so setuptools won't include them
# by default. Not load-bearing for `pip install -e` (editable installs read
# straight from the source tree) but would silently break a real `pip
# install .` or a container build that doesn't use -e -- worth getting right
# now rather than relearning the pip-install-e lesson a second time.
"api.agents.prompts" = ["*.txt"]
