name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run full backend test suite
        run: python -m pytest -q
      - name: Validate committed corpus
        run: python data/scripts/validate.py --all
      - name: Check generated projections are fresh
        run: python data/scripts/build.py --all --check
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit --strict -r requirements.txt

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Check production build
        run: npm run build
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
